<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JDJ 遊記 - 子相簿網頁產生器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #F9F8F6;
      font-family: 'PingFang TC', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen py-10 px-4">

  <main class="max-w-5xl mx-auto">
    <!-- 頁首 -->
    <header class="text-center mb-10">
      <span class="text-xs uppercase tracking-widest text-[#8C6239] font-semibold block mb-2">— ALBUM GENERATOR —</span>
      <h1 class="text-3xl font-bold text-[#1A2535] mb-2">JDJ 遊記 子相簿產生器</h1>
      <p class="text-stone-500 text-sm">本機載入多個 JSON → 條件篩選 → 一鍵匯出完整 index.html、main.js、data.json</p>
    </header>

    <!-- 步驟 1：上傳 JSON 檔案 -->
    <section class="bg-white border border-stone-200 rounded-xl p-6 mb-6 shadow-sm">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-bold text-[#1A2535] flex items-center gap-2">
          <span class="w-6 h-6 rounded-full bg-[#1A2535] text-white text-xs flex items-center justify-center">1</span>
          選擇來源 JSON 檔案（可複選多個檔案）
        </h2>
        <span id="uploadStats" class="text-xs font-semibold text-[#8C6239] bg-amber-50 px-3 py-1 rounded-full">尚未載入資料</span>
      </div>

      <label id="dropZone" class="border-2 border-dashed border-stone-300 hover:border-[#8C6239] rounded-xl p-8 flex flex-col items-center justify-center cursor-pointer transition-colors bg-stone-50/50">
        <i class="fa-solid fa-file-code text-3xl text-[#8C6239] mb-3"></i>
        <p class="text-sm font-medium text-slate-700 mb-1">點擊選擇或將多個 JSON 檔案拖曳至此（例如 data1.json, data2.json）</p>
        <p class="text-xs text-stone-400">所有資料皆在您的瀏覽器本機處理，不會上傳至任何伺服器</p>
        <input id="fileInput" type="file" accept=".json" multiple class="hidden">
      </label>

      <div id="fileList" class="mt-4 flex flex-wrap gap-2"></div>
    </section>

    <!-- 步驟 2：設定篩選條件 -->
    <section id="filterSection" class="bg-white border border-stone-200 rounded-xl p-6 mb-6 shadow-sm opacity-50 pointer-events-none transition-opacity">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-6">
        <h2 class="text-lg font-bold text-[#1A2535] flex items-center gap-2">
          <span class="w-6 h-6 rounded-full bg-[#1A2535] text-white text-xs flex items-center justify-center">2</span>
          設定篩選條件
        </h2>
        <div class="text-sm font-bold text-emerald-700 bg-emerald-50 px-4 py-1.5 rounded-lg border border-emerald-200">
          符合條件：<span id="matchedCount" class="text-lg">0</span> 筆（原始共 <span id="totalCount">0</span> 筆）
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 mb-4">
        <div>
          <label class="block text-xs font-semibold text-stone-500 mb-1">洲別 (region)</label>
          <select id="fRegion" class="w-full px-3 py-2 border border-stone-300 rounded-lg text-sm bg-white">
            <option value="all">全部洲別</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-stone-500 mb-1">國家 (country)</label>
          <select id="fCountry" class="w-full px-3 py-2 border border-stone-300 rounded-lg text-sm bg-white">
            <option value="all">全部國家</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-stone-500 mb-1">省 / 州 (province)</label>
          <select id="fProvince" class="w-full px-3 py-2 border border-stone-300 rounded-lg text-sm bg-white">
            <option value="all">全部省/州</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-stone-500 mb-1">城市 (city)</label>
          <select id="fCity" class="w-full px-3 py-2 border border-stone-300 rounded-lg text-sm bg-white">
            <option value="all">全部城市</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-stone-500 mb-1">年份 (year)</label>
          <select id="fYear" class="w-full px-3 py-2 border border-stone-300 rounded-lg text-sm bg-white">
            <option value="all">全部年份</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-stone-500 mb-1">媒體類型 (type)</label>
          <select id="fType" class="w-full px-3 py-2 border border-stone-300 rounded-lg text-sm bg-white">
            <option value="all">全部 (照片 + 影片)</option>
            <option value="image">僅照片 (image)</option>
            <option value="video">僅影片 (video)</option>
          </select>
        </div>
      </div>

      <div class="flex flex-col sm:flex-row gap-3 items-stretch sm:items-end mb-6">
        <div class="flex-grow">
          <label class="block text-xs font-semibold text-stone-500 mb-1">關鍵字篩選（搜尋所有欄位，支援 AND / OR，例如：外灘 or 墾丁）</label>
          <input id="fKeyword" type="text" placeholder="輸入關鍵字過濾..." class="w-full px-3 py-2 border border-stone-300 rounded-lg text-sm">
        </div>
        <button id="resetFilterBtn" class="px-4 py-2 border border-stone-300 rounded-lg text-xs font-semibold text-stone-600 hover:bg-stone-100 whitespace-nowrap">
          重設條件
        </button>
      </div>

      <!-- 資料預覽表 -->
      <div class="border border-stone-200 rounded-lg overflow-hidden">
        <div class="bg-stone-100 px-4 py-2 text-xs font-semibold text-stone-600 flex justify-between">
          <span>篩選結果預覽（前 8 筆）</span>
          <span class="text-stone-400">確認無誤後即可進行下方匯出</span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs">
            <thead class="bg-stone-50 border-b border-stone-200 text-stone-500">
              <tr>
                <th class="py-2 px-3">ID</th>
                <th class="py-2 px-3">年份</th>
                <th class="py-2 px-3">國家 / 省州 / 城市</th>
                <th class="py-2 px-3">類型</th>
                <th class="py-2 px-3">備註 (memo1)</th>
              </tr>
            </thead>
            <tbody id="previewTable" class="divide-y divide-stone-100">
              <tr><td colspan="5" class="py-6 text-center text-stone-400">請先於上方上傳 JSON 檔案</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- 步驟 3：自訂新相簿設定與匯出 -->
    <section id="exportSection" class="bg-white border border-stone-200 rounded-xl p-6 shadow-sm opacity-50 pointer-events-none transition-opacity">
      <h2 class="text-lg font-bold text-[#1A2535] flex items-center gap-2 mb-6">
        <span class="w-6 h-6 rounded-full bg-[#1A2535] text-white text-xs flex items-center justify-center">3</span>
        新網站標題設定與匯出檔案
      </h2>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block text-xs font-semibold text-stone-500 mb-1">網頁主標題 (H1)</label>
          <input id="siteTitle" type="text" value="JDJ 遊記" class="w-full px-3 py-2 border border-stone-300 rounded-lg text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-stone-500 mb-1">網頁副標題</label>
          <input id="siteSubtitle" type="text" value="The Grand Tour: Around the World" class="w-full px-3 py-2 border border-stone-300 rounded-lg text-sm">
        </div>
      </div>

      <div class="flex flex-wrap gap-6 mb-6 text-xs text-slate-700">
        <label class="flex items-center gap-2 cursor-pointer">
          <input id="optReindex" type="checkbox" checked class="rounded text-[#8C6239]">
          匯出時重新連續編號 ID (1, 2, 3...)，避免多檔合併時 ID 重複導致燈箱開錯照片
        </label>
        <label class="flex items-center gap-2 cursor-pointer">
          <input id="optAutoRender" type="checkbox" checked class="rounded text-[#8C6239]">
          開啟新網頁時直接顯示第一頁照片（不需先按「找照片」）
        </label>
        <label class="flex items-center gap-2 cursor-pointer">
          <input id="optCarousel" type="checkbox" class="rounded text-[#8C6239]">
          啟用網頁頂部隨機照片跑馬燈輪播
        </label>
      </div>

      <div class="flex flex-wrap gap-3 pt-4 border-t border-stone-100">
        <button id="downloadZipBtn" class="px-6 py-3 bg-[#1A2535] hover:bg-[#8C6239] text-white font-bold rounded-lg text-sm transition-colors flex items-center gap-2 shadow">
          <i class="fa-solid fa-file-zipper"></i>
          一鍵打包下載全部 (.zip)
        </button>
        <button id="dlHtmlBtn" class="px-4 py-3 border border-stone-300 hover:bg-stone-50 text-slate-700 font-semibold rounded-lg text-xs transition-colors">
          單獨下載 index.html
        </button>
        <button id="dlJsBtn" class="px-4 py-3 border border-stone-300 hover:bg-stone-50 text-slate-700 font-semibold rounded-lg text-xs transition-colors">
          單獨下載 main.js
        </button>
        <button id="dlJsonBtn" class="px-4 py-3 border border-stone-300 hover:bg-stone-50 text-slate-700 font-semibold rounded-lg text-xs transition-colors">
          單獨下載 data.json
        </button>
      </div>
    </section>
  </main>

  <script>
    let allRecords = [];
    let filteredRecords = [];

    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('border-[#8C6239]', 'bg-amber-50/40');
    });
    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('border-[#8C6239]', 'bg-amber-50/40');
    });
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('border-[#8C6239]', 'bg-amber-50/40');
      if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
    });
    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length) handleFiles(e.target.files);
    });

    async function handleFiles(files) {
      allRecords = [];
      const fileListEl = document.getElementById('fileList');
      fileListEl.innerHTML = '';

      for (const file of files) {
        try {
          const text = await file.text();
          const json = JSON.parse(text);
          if (Array.isArray(json)) {
            allRecords.push(...json);
            const badge = document.createElement('span');
            badge.className = 'inline-flex items-center gap-1.5 px-3 py-1 rounded-md text-xs font-medium bg-stone-100 text-slate-700 border border-stone-200';
            badge.innerHTML = `<i class="fa-solid fa-check text-emerald-600"></i> ${file.name} (${json.length} 筆)`;
            fileListEl.appendChild(badge);
          }
        } catch (err) {
          alert(`檔案「${file.name}」JSON 格式解析失敗：${err.message}`);
        }
      }

      if (allRecords.length > 0) {
        document.getElementById('uploadStats').textContent = `已載入 ${files.length} 個檔案，共 ${allRecords.length} 筆`;
        document.getElementById('totalCount').textContent = allRecords.length;
        document.getElementById('filterSection').classList.remove('opacity-50', 'pointer-events-none');
        document.getElementById('exportSection').classList.remove('opacity-50', 'pointer-events-none');
        initFilterDropdowns();
        applyFilters();
      }
    }

    function initFilterDropdowns() {
      populateSelect('fRegion', [...new Set(allRecords.map(d => d.region).filter(Boolean))].sort(), '全部洲別');
      populateSelect('fCountry', [...new Set(allRecords.map(d => d.country).filter(Boolean))].sort(), '全部國家');
      populateSelect('fYear', [...new Set(allRecords.map(d => String(d.year || '')).filter(Boolean))].sort().reverse(), '全部年份');
      updateCascadeProvince();
    }

    function populateSelect(id, items, defaultLabel) {
      const sel = document.getElementById(id);
      sel.innerHTML = `<option value="all">${defaultLabel}</option>`;
      items.forEach(val => sel.add(new Option(val, val)));
    }

    function updateCascadeProvince() {
      const region = document.getElementById('fRegion').value;
      const country = document.getElementById('fCountry').value;
      const list = allRecords
        .filter(d => (region === 'all' || d.region === region) && (country === 'all' || d.country === country))
        .map(d => d.province)
        .filter(Boolean);
      populateSelect('fProvince', [...new Set(list)].sort(), '全部省/州');
      updateCascadeCity();
    }

    function updateCascadeCity() {
      const region = document.getElementById('fRegion').value;
      const country = document.getElementById('fCountry').value;
      const province = document.getElementById('fProvince').value;
      const list = allRecords
        .filter(d =>
          (region === 'all' || d.region === region) &&
          (country === 'all' || d.country === country) &&
          (province === 'all' || d.province === province)
        )
        .map(d => d.city)
        .filter(Boolean);
      populateSelect('fCity', [...new Set(list)].sort(), '全部城市');
    }

    document.getElementById('fRegion').addEventListener('change', () => { updateCascadeProvince(); applyFilters(); });
    document.getElementById('fCountry').addEventListener('change', () => { updateCascadeProvince(); applyFilters(); });
    document.getElementById('fProvince').addEventListener('change', () => { updateCascadeCity(); applyFilters(); });
    document.getElementById('fCity').addEventListener('change', applyFilters);
    document.getElementById('fYear').addEventListener('change', applyFilters);
    document.getElementById('fType').addEventListener('change', applyFilters);
    document.getElementById('fKeyword').addEventListener('input', applyFilters);

    document.getElementById('resetFilterBtn').addEventListener('click', () => {
      document.getElementById('fRegion').value = 'all';
      document.getElementById('fCountry').value = 'all';
      document.getElementById('fYear').value = 'all';
      document.getElementById('fType').value = 'all';
      document.getElementById('fKeyword').value = '';
      updateCascadeProvince();
      applyFilters();
    });

    function applyFilters() {
      const region = document.getElementById('fRegion').value;
      const country = document.getElementById('fCountry').value;
      const province = document.getElementById('fProvince').value;
      const city = document.getElementById('fCity').value;
      const year = document.getElementById('fYear').value;
      const type = document.getElementById('fType').value;
      const keyword = document.getElementById('fKeyword').value.toLowerCase().trim();

      filteredRecords = allRecords.filter(item => {
        if (region !== 'all' && item.region !== region) return false;
        if (country !== 'all' && item.country !== country) return false;
        if (province !== 'all' && item.province !== province) return false;
        if (city !== 'all' && item.city !== city) return false;
        if (year !== 'all' && String(item.year || '') !== year) return false;
        if (type !== 'all' && item.type !== type) return false;

        if (!keyword) return true;
        const text = [
          String(item.year || ''),
          String(item.region || ''),
          String(item.type || ''),
          String(item.country || ''),
          String(item.province || ''),
          String(item.city || ''),
          String(item.memo1 || '')
        ].join(' ').toLowerCase();

        if (keyword.includes(' and ')) {
          return keyword.split(/\s+and\s+/i).every(k => text.includes(k.trim()));
        }
        if (keyword.includes(' or ')) {
          return keyword.split(/\s+or\s+/i).some(k => text.includes(k.trim()));
        }
        return text.includes(keyword);
      });

      document.getElementById('matchedCount').textContent = filteredRecords.length;
      renderPreview();
    }

    function renderPreview() {
      const tbody = document.getElementById('previewTable');
      if (filteredRecords.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="py-6 text-center text-stone-400">沒有符合條件的資料</td></tr>';
        return;
      }
      tbody.innerHTML = filteredRecords.slice(0, 8).map(item => `
        <tr>
          <td class="py-2 px-3 font-mono text-stone-500">${item.id ?? ''}</td>
          <td class="py-2 px-3">${item.year || ''}</td>
          <td class="py-2 px-3 font-medium">${[item.country, item.province, item.city].filter(Boolean).join(' / ')}</td>
          <td class="py-2 px-3">${item.type === 'video' ? '🎬 影片' : '🖼️ 照片'}</td>
          <td class="py-2 px-3 text-stone-600">${item.memo1 || '-'}</td>
        </tr>
      `).join('');
    }

    function buildExportArtifacts() {
      if (filteredRecords.length === 0) {
        alert('目前篩選結果為 0 筆，請調整篩選條件後再匯出！');
        return null;
      }

      const title = document.getElementById('siteTitle').value.trim() || 'JDJ 遊記';
      const subtitle = document.getElementById('siteSubtitle').value.trim() || 'The Grand Tour: Around the World';
      const reindex = document.getElementById('optReindex').checked;
      const autoRender = document.getElementById('optAutoRender').checked;
      const enableCarousel = document.getElementById('optCarousel').checked;

      const exportData = filteredRecords.map((item, idx) => ({
        ...item,
        id: reindex ? idx + 1 : item.id
      }));

      const htmlContent = `<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>${escapeHtml(title)}</title>
  <script src="https://cdn.tailwindcss.com"><\/script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --color-roma-blue: #1A2535;
      --color-wood: #8C6239;
      --color-bg: #F9F8F6;
    }
    body {
      background-color: var(--color-bg);
      font-family: 'PingFang TC', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }
    @keyframes marquee {
      0% { transform: translateX(0%); }
      100% { transform: translateX(-50%); }
    }
    .marquee-track {
      display: flex;
      width: max-content;
      animation: marquee 70s linear infinite;
    }
    .marquee-track:hover {
      animation-play-state: paused;
    }
    .overflow-hidden-lightbox {
      overflow: hidden !important;
    }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col justify-between">

  <div>
    <!-- 網頁上方照片輪播區 -->
    <div class="relative w-full overflow-hidden bg-[#1A2535] py-4 border-b border-stone-200 shadow-sm">
      <div id="carousel-track" class="marquee-track"></div>
    </div>

    <!-- 主內容容器 -->
    <main class="max-w-6xl mx-auto px-4 py-12">
      
      <header class="text-center mb-16">
        <span class="text-xs uppercase tracking-widest text-[#8C6239] font-semibold block mb-3">— TRAVEL JOURNAL —</span>
        <h1 class="text-3xl font-bold text-slate-800 mb-2">${escapeHtml(title)}</h1>
        <p class="text-stone-500 font-serif italic">${escapeHtml(subtitle)}</p>
      </header>

      <!-- 篩選與搜尋區（含三個篩選欄位） -->
      <section class="bg-white border border-stone-200 rounded-lg p-6 md:p-8 mb-12 shadow-sm flex flex-col gap-6">
        <div class="flex flex-col md:flex-row justify-between items-center gap-6">
          <div class="flex flex-col md:flex-row gap-6 md:gap-12 text-center md:text-left items-center w-full md:w-auto">
            <div>
              <span class="text-xs text-stone-400 uppercase tracking-wider block mb-1">已紀錄的足跡</span>
              <span id="stats" class="text-2xl font-light text-[#1A2535]">0 筆資料</span>
            </div>
            <!-- 三個篩選下拉選單 -->
            <div class="flex flex-wrap gap-3">
              <select id="countryFilter" class="px-3 py-2 border border-stone-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-[#8C6239]">
                <option value="all">所有國家</option>
              </select>
              <select id="provinceFilter" class="px-3 py-2 border border-stone-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-[#8C6239]">
                <option value="all">所有省/州</option>
              </select>
              <select id="cityFilter" class="px-3 py-2 border border-stone-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-[#8C6239]">
                <option value="all">所有城市</option>
              </select>
            </div>
          </div>
        </div>

        <div class="flex flex-col md:flex-row justify-between items-center gap-4 pt-4 border-t border-stone-100">
          <button id="goBtn" class="px-4 py-3 bg-[#1A2535] text-white rounded-lg hover:bg-[#8C6239] transition-all text-sm whitespace-nowrap">找照片</button>
          <input
            id="searchInput"
            type="text"
            placeholder="搜尋 關鍵字 or/and 關鍵字 ..."
            class="w-full px-4 py-3 border border-stone-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#8C6239]"
          >
          <button id="resetBtn" class="w-full md:w-auto px-5 py-3 border border-stone-300 text-xs tracking-wider text-stone-600 hover:bg-stone-50 transition-all uppercase rounded whitespace-nowrap">
            重設
          </button>
        </div>
      </section>

      <!-- 照片網格區 -->
      <section id="gallery" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8 mb-16"></section>

      <!-- 空狀態提示 -->
      <div id="emptyState" class="text-center py-12 text-stone-400 hidden">
        沒有找到符合條件的照片。
      </div>

      <!-- 分頁按鈕 -->
      <nav id="pagination" class="flex justify-center items-center gap-2 border-t border-stone-200 pt-8"></nav>

    </main>
  </div>

  <!-- 燈箱 (Lightbox) 結構 -->

      const jsContent = `let rawData = [];
let filteredData = [...rawData];
let currentPage = 1;
const itemsPerPage = 12;

document.addEventListener("DOMContentLoaded", () => {
    fetch('data.json')
    .then(res => {
        if (!res.ok) throw new Error('無法載入 data.json');
        return res.json();
    })
    .then(data => {
        rawData = data;
        filteredData = [...rawData];

        initCountryFilter();
        updateProvinceOptions('all');
        ${enableCarousel ? 'initCarousel();' : '// initCarousel();'}
        ${autoRender ? 'renderGallery();' : ''}

        document.getElementById('countryFilter').onchange = (e) => { 
            updateProvinceOptions(e.target.value); 
        };
        
        document.getElementById('provinceFilter').onchange = (e) => {
            const selectedCountry = document.getElementById('countryFilter').value;
            updateCityOptions(selectedCountry, e.target.value);
        };

        document.getElementById('cityFilter').onchange = () => {};
        
        document.getElementById('goBtn').onclick = () => {
            handleFilter(); 
        };

        document.getElementById('searchInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleFilter();
        });

        document.getElementById('resetBtn').onclick = () => {
            document.getElementById('countryFilter').value = 'all';
            updateProvinceOptions('all');
            document.getElementById('searchInput').value = '';
            filteredData = [...rawData];
            currentPage = 1;
            renderGallery(); 
        };

        setupLightbox();
    })
    .catch(error => {
        console.error('載入資料發生錯誤:', error);
        const gallery = document.getElementById('gallery');
        if (gallery) {
            gallery.innerHTML = '<p class="col-span-full text-center text-red-500">無法成功載入資料檔案，請確認 data.json 格式與路徑是否正確（本機預覽請透過本地伺服器開啟）。</p>';
        }
    });
});

function getGoogleDriveId(url) {
    if (!url) return null;
    const regId = /\\/file\\/d\\/([a-zA-Z0-9_-]+)/;
    const regIdQuery = /[?&]id=([a-zA-Z0-9_-]+)/;
    
    const match1 = url.match(regId);
    if (match1 && match1[1]) return match1[1];
    
    const match2 = url.match(regIdQuery);
    if (match2 && match2[1]) return match2[1];
    
    return null;
}

function getThumbnail(url) {
    if (!url) return 'https://via.placeholder.com/400x260?text=No+Preview';
    const driveId = getGoogleDriveId(url);
    if (driveId) {
        return \`https://lh3.googleusercontent.com/d/\${driveId}=w1200\`;
    }
    return url;
}

function initCarousel() {
    const track = document.getElementById('carousel-track');
    if (!track || rawData.length === 0) return;

    const shuffled = [...rawData].sort(() => 0.5 - Math.random());
    const carouselItems = shuffled.slice(0, 30);
    const duplicatedItems = [...carouselItems, ...carouselItems];

    track.innerHTML = duplicatedItems.map(item => {
        const thumb = getThumbnail(item.url);
        return \`
            <div class="w-48 h-32 mx-2 flex-shrink-0 overflow-hidden rounded shadow-sm border border-stone-800 bg-stone-900 relative group cursor-pointer" onclick="openLightbox(\${item.id})">
              <img src="\${thumb}" alt="\${item.country || ''}" class="w-full h-full object-cover opacity-75 hover:opacity-100 transition-opacity duration-300">
              \${item.type === 'video' ? \`
                <div class="absolute inset-0 flex items-center justify-center bg-black/30 text-white pointer-events-none">
                  <i class="fa-solid fa-play text-xs opacity-85"></i>
                </div>
              \` : ''}
            </div>
        \`;
    }).join('');
}

function initCountryFilter() {
    const countrySelect = document.getElementById('countryFilter');
    if (!countrySelect) return;
    const countries = [...new Set(rawData.map(d => d.country))].filter(Boolean).sort();
    countries.forEach(c => countrySelect.add(new Option(c, c)));
}

function updateProvinceOptions(selectedCountry) {
    const provinceSelect = document.getElementById('provinceFilter');
    if (!provinceSelect) return;
    provinceSelect.innerHTML = '<option value="all">所有省/州</option>';
    const availableProvinces = rawData
        .filter(item => selectedCountry === 'all' || item.country === selectedCountry)
        .map(item => item.province)
        .filter(Boolean);
    [...new Set(availableProvinces)].sort().forEach(p => provinceSelect.add(new Option(p, p)));
    updateCityOptions(selectedCountry, provinceSelect.value);
}

function updateCityOptions(selectedCountry, selectedProvince) {
    const citySelect = document.getElementById('cityFilter');
    if (!citySelect) return;
    citySelect.innerHTML = '<option value="all">所有城市</option>';
    const availableCities = rawData
        .filter(item => {
            const matchCountry = (selectedCountry === 'all' || item.country === selectedCountry);
            const matchProvince = (selectedProvince === 'all' || item.province === selectedProvince);
            return matchCountry && matchProvince;
        })
        .map(item => item.city)
        .filter(Boolean);
    [...new Set(availableCities)].sort().forEach(c => citySelect.add(new Option(c, c)));
}

function renderGallery() {
    const gallery = document.getElementById('gallery');
    const stats = document.getElementById('stats');
    const emptyState = document.getElementById('emptyState');
    
    if (!gallery) return;

    gallery.innerHTML = '';
    if (stats) stats.textContent = \`找到 \${filteredData.length} 筆資料 (第 \${currentPage} 頁)\`;

    if (filteredData.length === 0) {
        if (emptyState) emptyState.classList.remove('hidden');
        const pagination = document.getElementById('pagination');
        if (pagination) pagination.innerHTML = '';
        return;
    }
    if (emptyState) emptyState.classList.add('hidden');

    const start = (currentPage - 1) * itemsPerPage;
    const pageItems = filteredData.slice(start, start + itemsPerPage);
    const fragment = document.createDocumentFragment();

    pageItems.forEach(item => {
        const card = document.createElement('div');
        card.className = 'glass-card rounded-2xl overflow-hidden shadow-sm hover:shadow-xl transition-all flex flex-col bg-white border border-stone-200 group';
        
        const countryBadgeHTML = item.country ? \`
            <div class="absolute top-3 right-3 bg-white/90 backdrop-blur px-2 py-1 rounded text-[10px] font-bold text-blue-600 shadow-sm z-10">\${item.country}</div>
        \` : '';

        const videoOverlayHTML = item.type === 'video' ? \`
            <div class="absolute inset-0 flex items-center justify-center bg-stone-900 bg-opacity-30 z-10 text-white transition-opacity duration-300">
              <div class="w-12 h-12 rounded-full bg-white/20 backdrop-blur-md flex items-center justify-center shadow-lg group-hover:scale-110 transition-transform">
                <i class="fa-solid fa-play text-lg translate-x-0.5"></i>
              </div>
            </div>
        \` : '';

        const provinceCityText = [item.province, item.city].filter(Boolean).join(' ');
        const locationRowHTML = provinceCityText ? \`
            <div class="text-sm font-bold text-black mb-1">\${provinceCityText}</div>
        \` : '';

        const memoRowHTML = item.memo1 ? \`
            <p class="text-xs font-semibold text-stone-600">🎯 \${item.memo1}</p>
        \` : '';

        const hasInfo = provinceCityText || item.memo1;

        card.innerHTML = \`
            <div onclick="openLightbox(\${item.id})" class="img-container relative aspect-[4/3] overflow-hidden bg-stone-100 cursor-pointer">
                <img src="\${getThumbnail(item.url)}" 
                     loading="lazy" 
                     alt="\${item.country || ''}" 
                     class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
                     onerror="this.src='https://via.placeholder.com/400x260?text=Image+Not+Found'">
                <div class="absolute top-3 left-3 bg-white/90 backdrop-blur px-2 py-1 rounded text-[10px] font-bold text-blue-600 shadow-sm z-10">\${item.year || ''} (#\${item.id || ''})</div>
                \${countryBadgeHTML}
                \${videoOverlayHTML}
            </div>
            
            <div class="p-5 flex flex-col justify-between flex-grow bg-white border-t border-stone-50">
                \${hasInfo ? \`
                    <h3 class="mb-2">
                        \${locationRowHTML}\${memoRowHTML}
                    </h3>
                \` : ''}
            </div>
        \`;
        fragment.appendChild(card);
    });

    gallery.appendChild(fragment);
    renderPagination();
}

function renderPagination() {
    const container = document.getElementById('pagination');
    if (!container) return;
    const totalPages = Math.ceil(filteredData.length / itemsPerPage);
    container.innerHTML = '';
    if (totalPages <= 1) return;

    const createBtn = (label, page, active = false, disabled = false) => {
        const btn = document.createElement('button');
        btn.innerHTML = label;
        btn.disabled = disabled;
        btn.className = \`min-w-[40px] h-10 px-3 rounded-lg font-medium \${active ? 'bg-blue-600 text-white' : 'bg-white text-slate-600 border border-slate-100'} \${disabled ? 'opacity-30' : 'hover:bg-blue-50'}\`;
        btn.onclick = () => { currentPage = page; renderGallery(); window.scrollTo({ top: 350, behavior: 'smooth' }); };
        return btn;
    };

    const maxVisible = 8;
    let startPage = Math.max(1, currentPage - Math.floor(maxVisible / 2));
    let endPage = startPage + maxVisible - 1;

    if (endPage > totalPages) {
        endPage = totalPages;
        startPage = Math.max(1, endPage - maxVisible + 1);
    }

    container.appendChild(createBtn('«', 1, false, currentPage === 1));
    container.appendChild(createBtn('‹', Math.max(1, currentPage - 1), false, currentPage === 1));
    
    for (let i = startPage; i <= endPage; i++) {
        container.appendChild(createBtn(i, i, i === currentPage));
    }
    
    container.appendChild(createBtn('›', Math.min(totalPages, currentPage + 1), false, currentPage === totalPages));
    container.appendChild(createBtn('»', totalPages, false, currentPage === totalPages));
}

function handleFilter() {
    const c = document.getElementById('countryFilter').value;
    const p = document.getElementById('provinceFilter').value;
    const city = document.getElementById('cityFilter').value;
    const keyword = document.getElementById('searchInput').value.toLowerCase().trim();

    filteredData = rawData.filter(item => {
        const matchCountry = (c === 'all' || item.country === c);
        const matchProvince = (p === 'all' || item.province === p);
        const matchCity = (city === 'all' || item.city === city);
        
        if (!matchCountry || !matchProvince || !matchCity) return false;
        if (!keyword) return true;

        const text = [
            String(item.year || ''),
            String(item.region || ''),
            String(item.type || ''),
            String(item.country || ''),
            String(item.province || ''),
            String(item.city || ''),
            String(item.memo1 || '')
        ].join(' ').toLowerCase();

        if (keyword.includes(' and ')) {
            const keywords = keyword.split(/\\s+and\\s+/i);
            return keywords.every(k => text.includes(k.trim()));
        }

        if (keyword.includes(' or ')) {
            const keywords = keyword.split(/\\s+or\\s+/i);
            return keywords.some(k => text.includes(k.trim()));
        }

        return text.includes(keyword);
    });

    currentPage = 1;
    renderGallery();
}

function setupLightbox() {
    const lightbox = document.getElementById('lightbox');
    const closeBtn = document.getElementById('lightbox-close');

    if (!lightbox) return;

    if (closeBtn) {
        closeBtn.addEventListener('click', closeLightbox);
    }
    lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox || e.target.id === 'lightbox-content-box') {
            closeLightbox();
        }
    });

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !lightbox.classList.contains('hidden')) {
            closeLightbox();
        }
    });
}

window.openLightbox = function(id) {

                      <i class="fa-solid fa-film"></i>

                    <p class="text-white text-sm mb-6 font-medium">點擊下方按鈕即可下載並播放影片，播放完畢可直接返回網頁</p>
                    <a href="\${directVideoUrl}" class="px-6 py-3 bg-white text-slate-900 rounded-lg font-bold hover:bg-stone-200 transition-all text-sm shadow">
                      播放 / 下載影片

                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"

                \`;

        } else {

                <img src="\${fullImgUrl}" alt="" class="max-w-full max-h-[72vh] object-contain rounded-lg block">
              </div>
            \`;
        }

    document.body.classList.remove('overflow-hidden-lightbox');
    
    setTimeout(() => {
        lightbox.classList.add('hidden');
        if (contentBox) contentBox.innerHTML = '';

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    function triggerDownload(filename, content, mime = 'text/plain;charset=utf-8') {
      const blob = new Blob([content], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    document.getElementById('dlHtmlBtn').addEventListener('click', () => {

      const res = buildExportArtifacts();
      if (res) triggerDownload('main.js', res.jsContent, 'application/javascript;charset=utf-8');
    });

    document.getElementById('dlJsonBtn').addEventListener('click', () => {
      const res = buildExportArtifacts();
      if (res) triggerDownload('data.json', res.jsonContent, 'application/json;charset=utf-8');
